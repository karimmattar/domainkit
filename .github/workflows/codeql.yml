# CodeQL's security queries over the Python package, on pushes to main,
# pull requests, and weekly (the queries change with no change here). It
# complements Semgrep (ci.yml): Semgrep matches patterns within a file;
# CodeQL follows values from where they enter (a request, a header, a
# file) across functions and modules to where they are used (SQL, a path,
# a URL, a log line). Alerts go to the repository's code scanning page and
# to the pull request; a check that gates merging is the ruleset's to add.
# Free for public repositories.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Uploads the results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - src
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:python
