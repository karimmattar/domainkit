# OpenSSF Scorecard: how the repository keeps its supply chain (pinned
# actions, branch protection, token permissions, signed releases, fuzzing,
# a security policy), checked on pushes to main, weekly, and when the
# branch protection changes. Its findings go to the code scanning page;
# the results are published to the OpenSSF API for the badge in the README.
# Publishing allows only these steps, on the default branch, so the job
# does nothing else. It checks no pull request and gates nothing.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Reads the workflows' runs, for the CI-tests check.
      security-events: write # Uploads the findings to code scanning.
      id-token: write # Proves to the OpenSSF API which workflow published.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
