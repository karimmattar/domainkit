# Push a tag "vX.Y.Z" on a commit of main, matching pyproject.toml's
# version, to publish it to PyPI. The tagged commit's own CI run, the one
# its push to main started, must have passed the whole CI workflow (lint,
# types, tests, integration, coverage, benchmarks, build, bill of
# materials, Semgrep, audit): this workflow finds it, waits for it if it is
# still running, and refuses the tag unless it succeeded. Nothing is run
# again, and the package published is the one that run built and
# smoke-tested, downloaded from it.
# Before publishing, GitHub attests the wheel and sdist: SLSA build
# provenance for both, and CI's CycloneDX bill of materials for the wheel
# ("gh attestation verify <file> --repo karimmattar/domainkit").
# Publishing uses trusted publishing (OIDC): no API token is stored anywhere.
# One-time setup is in docs/versioning.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, and never cancelled halfway: two tags pushed
# together publish one after the other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.2.1"

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(poetry version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      # Commits reach main only through pull requests that pass CI
      # (.github/rulesets/main.json, applied as docs/versioning.md says), so
      # a tag on any other commit is refused.
      - name: Check that the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $TAG is not on a commit of main" >&2
            exit 1
          fi

  # The CI run of the push to main that made the tagged commit, by a
  # maintainer (pushes to main come only from merged pull requests): its
  # id, once it has succeeded. Its dist and sbom artifacts are what the
  # jobs below attest and publish.
  ci:
    needs: tag
    runs-on: ubuntu-24.04
    # A run that started with the merge may still be going.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Main's CI runs.
    outputs:
      run-id: ${{ steps.run.outputs.id }}
    steps:
      - name: Find main's CI run for the tagged commit, and require it green
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          id="$(gh run list --repo "$REPO" --workflow ci.yml --branch main \
            --event push --commit "$SHA" --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -z "$id" ]; then
            echo "::error::No CI run of a push to main for $SHA; tag a commit main's CI ran on." >&2
            exit 1
          fi
          gh run watch "$id" --repo "$REPO" --interval 30 > /dev/null || true
          conclusion="$(gh run view "$id" --repo "$REPO" --json conclusion --jq .conclusion)"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run $id for $SHA ended with '$conclusion'; re-run it or fix main." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Publishing what CI run $id built: $GITHUB_SERVER_URL/$REPO/actions/runs/$id" >> "$GITHUB_STEP_SUMMARY"

  # The audit again, on the tagged commit: an advisory or a leaked secret
  # can come to light after main's run. The same steps as CI's audit job
  # (domainkit_tests/test_ci.py checks that).
  audit:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      # PYSEC-2026-1325 (CVE-2024-23342): a timing attack on ecdsa signing.
      # immudb's SDK only verifies signatures with ecdsa, which the advisory
      # says is unaffected, and no fix is planned. See SECURITY.md.
      - run: poetry run pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-1325
      - name: Scan the whole history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose

  # Signed statements, kept by GitHub, that these files came from this
  # workflow at this commit, and what the wheel is made of. Its own job, so
  # only it may write attestations.
  attest:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # The CI run's artifacts.
      id-token: write # A Sigstore certificate naming this workflow run.
      attestations: write # Keeps the attestations with the repository.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest the bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: sbom/sbom.cdx.json

  publish:
    needs: [ci, audit, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/domainkit/
    permissions:
      actions: read # The CI run's artifacts.
      id-token: write
    steps:
      # The wheel and sdist from CI's build job, which installed the wheel
      # in a clean environment first.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      # Uploads with PEP 740 attestations by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
