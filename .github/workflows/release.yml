# Push a tag "vX.Y.Z" on the release commit of main: the one that set
# pyproject.toml's version to X.Y.Z, or added CHANGELOG.md's dated section
# for it, with [Unreleased] emptied (.github/scripts/release_check.py).
# The tagged commit's own CI run, the one its push to main started, must
# have passed the checks the main branch ruleset requires (lint, types,
# tests, integration, coverage, benchmarks, build, bill of materials,
# Semgrep, audit) and attested what it built: this workflow finds it, waits
# for it if it is still running, and refuses the tag unless each of those
# succeeded (.github/scripts/required_jobs.py). The run's own conclusion
# counts advisory jobs too, such as stress (3.14t), and is not used
# (INFRA-14). Nothing is run again, and the package published is the one
# that run built and smoke-tested, downloaded from it.
# That run attested what it built: SLSA build provenance for the wheel and
# sdist, naming ci.yml and that run, and its CycloneDX bill of materials for
# the wheel ("gh attestation verify <file> --repo karimmattar/domainkit").
# Before publishing, this workflow checks both, for each file it publishes.
# Publishing uses trusted publishing (OIDC): no API token is stored anywhere.
# One-time setup is in docs/versioning.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A run of its own for each tag, never cancelled: one group for every tag
# kept a single pending run, so a third tag pushed while one waited for
# approval cancelled the second, silently (INFRA-21). Tags pushed together
# each get their verdict; the older of two in one line is refused.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.2.1"

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(poetry version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      # Commits reach main only through pull requests that pass CI
      # (.github/rulesets/main.json, applied as docs/versioning.md says), so
      # a tag on any other commit is refused.
      - name: Check that the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $TAG is not on a commit of main" >&2
            exit 1
          fi
      # Newer than the tags before it, the changelog's dated section, and
      # the commit that made the release (docs/versioning.md, step 1-2).
      - name: Check that the tagged commit is the release of that version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_check.py "$TAG"

  # The CI run of the push to main that made the tagged commit, by a
  # maintainer (pushes to main come only from merged pull requests): its
  # id, once the checks main.json requires, and attest, have succeeded in
  # it. Its dist and sbom artifacts, and the attestations it made of them,
  # are what the jobs below check and publish.
  ci:
    needs: tag
    runs-on: ubuntu-24.04
    # A run that started with the merge may still be going.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Main's CI runs.
    outputs:
      run-id: ${{ steps.run.outputs.id }}
    steps:
      # The ruleset and the script that reads it, at the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Find main's CI run for the tagged commit, and require its checks
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          id="$(gh run list --repo "$REPO" --workflow ci.yml --branch main \
            --event push --commit "$SHA" --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -z "$id" ]; then
            echo "::error::No CI run of a push to main for $SHA; tag a commit main's CI ran on." >&2
            exit 1
          fi
          gh run watch "$id" --repo "$REPO" --interval 30 > /dev/null || true
          gh run view "$id" --repo "$REPO" --json status,jobs > run.json
          if ! python3 .github/scripts/required_jobs.py .github/rulesets/main.json < run.json; then
            echo "::error::CI run $id for $SHA did not pass the checks main.json requires; re-run them or fix main." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Publishing what CI run $id built: $GITHUB_SERVER_URL/$REPO/actions/runs/$id" >> "$GITHUB_STEP_SUMMARY"

  # The audit again, on the tagged commit: an advisory or a leaked secret
  # can come to light after main's run. The same steps as CI's audit job
  # (domainkit_tests/test_ci.py checks that), then the ranges this release
  # publishes.
  audit:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      # PYSEC-2026-1325 (CVE-2024-23342): a timing attack on ecdsa signing.
      # immudb's SDK only verifies signatures with ecdsa, which the advisory
      # says is unaffected, and no fix is planned. See SECURITY.md.
      - run: poetry run pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-1325
      - name: Scan the whole history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose
      # The lock above is the set CI tested; "pip install domainkit[...]"
      # resolves the newest releases the published ranges allow, which only
      # CI's advisory newest job audits. Audited here too, before they are
      # published (INFRA-21): the wheel with every extra, in an environment
      # of its own, without the dev group.
      - name: Audit what the published ranges resolve to today
        shell: bash
        run: |
          poetry build --format wheel
          extras="$(python -c 'import tomllib; print(",".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]))')"
          python -m venv .ranges
          .ranges/bin/python -m pip install "$(ls dist/*.whl)[$extras]"
          poetry run pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-1325 \
            --path "$(ls -d .ranges/lib/python3*/site-packages)"

  publish:
    needs: [ci, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/domainkit/
    permissions:
      actions: read # The CI run's artifacts.
      attestations: read # Checks them before publishing.
      id-token: write
    steps:
      # The wheel and sdist from CI's build job, which installed the wheel
      # in a clean environment first.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      # Each file must carry provenance signed by ci.yml on main at the
      # tagged commit, from GitHub's own runners; the wheel its bill of
      # materials too. A file that run did not build is refused.
      - name: Check that main's CI run attested every file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/ci.yml" \
              --source-ref refs/heads/main --source-digest "$SHA" \
              --deny-self-hosted-runners
          done
          for wheel in dist/*.whl; do
            gh attestation verify "$wheel" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/ci.yml" \
              --source-ref refs/heads/main --source-digest "$SHA" \
              --deny-self-hosted-runners --predicate-type https://cyclonedx.org/bom
          done
      # Uploads with PEP 740 attestations by default.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
