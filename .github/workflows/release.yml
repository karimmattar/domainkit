# Push a tag "vX.Y.Z" on a commit of main, matching pyproject.toml's
# version, to publish it to PyPI. The tagged commit must pass the whole CI
# workflow here (lint, types, tests, integration, coverage, build, audit),
# and the package published is the one CI built and smoke-tested.
# Publishing uses trusted publishing (OIDC): no API token is stored anywhere.
# One-time setup is in docs/versioning.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, and never cancelled halfway: two tags pushed
# together publish one after the other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  POETRY_VERSION: "2.2.1"

jobs:
  tag:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(poetry version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      # Commits reach main only through reviewed pull requests, so a tag on
      # any other commit is refused.
      - name: Check that the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $TAG is not on a commit of main" >&2
            exit 1
          fi

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/domainkit/
    permissions:
      id-token: write
    steps:
      # The wheel and sdist from CI's build job, which installed the wheel
      # in a clean environment first.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Uploads with PEP 740 attestations by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
