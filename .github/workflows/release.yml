# Push a tag "vX.Y.Z" matching pyproject.toml's version to publish it to PyPI.
# Publishing uses trusted publishing (OIDC): no API token is stored anywhere.
# One-time setup is in docs/versioning.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(poetry version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - run: poetry sync --all-extras --with dev
      - run: poetry run pytest --cov -q
      - run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/domainkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Uploads with PEP 740 attestations by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
