# Every push and pull request: lint, tests, build, a bill of materials, and
# audits. A pull request that changes only docs runs the docs job instead of
# the suite (see changes). A release tag reuses the run of its commit's push
# to main: release.yml requires it green and publishes what its build job
# built. Pull requests, and weekly: the tests against the newest releases
# the ranges in pyproject.toml allow, and against their floors. Weekly (and
# on demand): a full mutation testing run. The suite runs on every core
# (pytest-xdist, -n auto). Actions are pinned to commit SHAs and images to
# digests; Renovate updates both.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One group per event: never the weekly mutation run's with a push to main,
# which once cancelled it before it could finish. A new push to a pull
# request cancels the run before it (its ref, refs/pull/N/merge, is the
# pull request's). Every other run gets a group of its own commit: a push
# to main is never cancelled, since it is the run a release of that commit
# reuses, and a group shared by commits would also cancel the pending run
# of one merged between two others. Scheduled and dispatched runs are
# never cancelled; the next one waits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

jobs:
  # Whether a pull request changes anything but docs (docs/**, and Markdown
  # at the top of the repository; .github/scripts/changed.py). If not, the
  # expensive jobs are skipped and the docs job runs the tests that read the
  # docs. The ruleset's checks still report: a job skipped by its condition
  # reports success. The test matrix starts and skips its steps instead: a
  # matrix job skipped whole reports one check, under its unexpanded name,
  # and "test (3.13)" would wait forever. Every other event runs it all, a
  # push to main included, since a release reuses that run. If this job
  # fails, the jobs that need it are skipped and it fails the ruleset.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      # The merge commit and its parents: the base branch, and the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # No rename detection, and both paths of every line: a file moved
      # from src/ or domainkit_tests/ into docs/ must count as code.
      - id: paths
        name: Find whether anything but docs changed
        run: >-
          git diff --no-renames --name-status HEAD^1 HEAD
          | python3 .github/scripts/changed.py >> "$GITHUB_OUTPUT"

  # Only for a pull request that changes docs alone: the tests that read
  # them (the API reference against every __all__, links, anchors and the
  # settings tables, the README, tutorial, and recipes as written, the
  # workflows' names in versioning.md). Any other change runs them in the
  # test jobs.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      - run: >-
          poetry run pytest -n auto --junitxml=junit.xml
          domainkit_tests/test_api.py domainkit_tests/test_ci.py
          domainkit_tests/test_docs.py domainkit_tests/test_recipes.py
          domainkit_tests/test_sec13c_1_upgrade_guide_skips_removals.py
          domainkit_tests/test_sec14b_5_erase_leaves_documented_code.py
          domainkit_tests/test_walkthroughs.py

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry check --lock
      - run: poetry sync --all-extras --with dev
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy
      # Every package src imports is declared ([tool.deptry] in pyproject.toml).
      - run: poetry run deptry .

  # The main branch ruleset (.github/rulesets/main.json) requires the names
  # of the jobs that run on pull requests; rename them there in the same
  # change. Those jobs skip the weekly run: nothing changed since the push.
  test:
    name: test (${{ matrix.python }})
    needs: changes
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    # The suite takes about 4 minutes on the runner's 4 cores; a
    # slower runner must not fail it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      COVERAGE_FILE: .coverage.test-${{ matrix.python }}
    # Every step is skipped for a pull request that changes only docs.
    steps:
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - if: needs.changes.outputs.code != 'false'
        run: pipx install "poetry==${POETRY_VERSION}"
      - if: needs.changes.outputs.code != 'false'
        run: poetry sync --all-extras --with dev
      - if: needs.changes.outputs.code != 'false'
        run: >-
          poetry run pytest -n auto --dist worksteal --cov --cov-report=term
          --cov-report=xml --junitxml=junit.xml
      - if: ${{ always() && needs.changes.outputs.code != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14
      - if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-test-${{ matrix.python }}
          path: .coverage.test-${{ matrix.python }}
          include-hidden-files: true
          retention-days: 1

  # Free-threaded Python (3.14t, no GIL): the locks around state that event
  # loops on several threads share (rate limits, refused-credential holds,
  # the hashing pool, caches, the logging and reporting queues, live
  # connection slots, event bus subscriptions) meet threads
  # that really run at once, and test_free_threading checks that importing
  # domainkit keeps the GIL off. With every warning an error, a module that
  # turned the GIL back on would fail the job. Only those tests run: the
  # whole suite crashes the 3.14.6t interpreter (a segmentation fault in
  # mimalloc's free, at a different test each run, in the main thread),
  # already at 0.7.0, so it waits for a fix upstream (docs/runtime.md).
  # Coverage comes from the other jobs.
  free-threaded:
    name: test (3.14t)
    needs: changes
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Poetry 2.2.1 installs the default build's wheels (cp314) on
    # free-threaded Python, whose extensions 3.14t cannot load (pydantic-core
    # fails to import); 2.4.3 installs the cp314t wheels from the same lock
    # file. The other jobs, and the lock check, keep 2.2.1.
    env:
      POETRY_VERSION: "2.4.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry env use python3.14t
      - run: >-
          poetry sync --with dev --extras "postgres sqlite metrics tracing argon2
          jwt mfa rabbitmq redis uploads testing webhooks tzdata uvloop granian"
      - run: poetry run python -c "import sys; assert not sys._is_gil_enabled()"
      - run: >-
          poetry run pytest -p no:cov domainkit_tests/test_free_threading.py
          domainkit_tests/test_log.py domainkit_tests/test_reporting.py
          domainkit_tests/test_loops.py domainkit_tests/test_auth_hashers.py
          domainkit_tests/test_cache.py domainkit_tests/test_throttles.py
          domainkit_tests/test_ratelimit_and_idempotency.py
          domainkit_tests/test_proxies_and_reporting.py
          domainkit_tests/test_blocking.py domainkit_tests/test_servers.py
          domainkit_tests/test_orm_loading.py

  # The free-threading tests again, many times, on 3.14t: a race between
  # threads shows in some runs only. Each run takes a new random order
  # (pytest-randomly), so loops on threads meet the shared state in another
  # interleaving each time; any failing run fails the job. Not a required
  # check (test_ci.py's ADVISORY): on 3.14.6t some runs crash inside
  # SQLAlchemy's compiled extensions (engines made on threads at once), at
  # 0.9.2 too, which waits for a fix upstream (docs/runtime.md).
  free-threaded-stress:
    name: stress (3.14t)
    needs: changes
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # As free-threaded: Poetry 2.4.3 installs the cp314t wheels.
    env:
      POETRY_VERSION: "2.4.3"
      RUNS: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry env use python3.14t
      - run: >-
          poetry sync --with dev --extras "postgres sqlite metrics tracing argon2
          jwt mfa rabbitmq redis uploads testing webhooks tzdata uvloop granian"
      - run: poetry run python -c "import sys; assert not sys._is_gil_enabled()"
      - name: Run the free-threading tests many times
        run: |
          for run in $(seq "$RUNS"); do
            echo "Run $run of $RUNS"
            poetry run pytest -p no:cov -q domainkit_tests/test_free_threading.py || exit 1
          done

  # The suite again against real servers: PostgreSQL (row locks, the audit
  # triggers, timeouts, partitions, migrations), immudb with TLS and a
  # signing key (verified ledgers, evidence), Redis (plain and TLS) and
  # Valkey (caches, shared rate limits, a least-privilege user), and RabbitMQ
  # (plain and TLS: brokered workers, a least-privilege user). Tests that
  # need a server are skipped elsewhere, so a skip here means a server went
  # unused: fail.
  integration:
    needs: changes
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    # The suite takes about 6 minutes on the runner's 4
    # cores; a slower runner must not fail it.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      COVERAGE_FILE: .coverage.integration
      DOMAINKIT_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      DOMAINKIT_TEST_IMMUDB_URL: immudb://immudb:immudb@localhost:3322/defaultdb
      DOMAINKIT_TEST_IMMUDB_CA: .ci/immudb/server.crt
      DOMAINKIT_TEST_IMMUDB_SIGNING_KEY: .ci/immudb/signing.pub
      DOMAINKIT_TEST_REDIS_URL: redis://localhost:6379/0
      DOMAINKIT_TEST_REDIS_TLS_URL: rediss://localhost:6380/0
      DOMAINKIT_TEST_REDIS_CA: .ci/redis/server.crt
      DOMAINKIT_TEST_VALKEY_URL: redis://localhost:6381/0
      DOMAINKIT_TEST_RABBITMQ_URL: amqp://domainkit:domainkit@localhost:5672/
      DOMAINKIT_TEST_RABBITMQ_TLS_URL: amqps://domainkit:domainkit@localhost:5671/
      DOMAINKIT_TEST_RABBITMQ_CA: .ci/rabbitmq/server.crt
      DOMAINKIT_TEST_RABBITMQ_MANAGEMENT_URL: http://domainkit:domainkit@localhost:15672
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # immudb needs files at start (a certificate, a signing key), which a
      # service container cannot get, so it starts here.
      - name: Start immudb with TLS and a signing key
        run: |
          mkdir -p .ci/immudb
          cd .ci/immudb
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout server.key -out server.crt 2>/dev/null
          openssl ecparam -name prime256v1 -genkey -noout -out signing.key
          openssl ec -in signing.key -pubout -out signing.pub 2>/dev/null
          chmod 644 server.key signing.key
          docker run -d --name immudb -p 3322:3322 -v "$PWD:/certs:ro" \
            codenotary/immudb:1.11.2@sha256:f2efcf6a3de73b31691e0afb8dfec972642aaf0699b93387d1ec6074aedb2953 \
            --certificate /certs/server.crt --pkey /certs/server.key \
            --signingKey /certs/signing.key --pgsql-server=false --web-server=false
          for _ in $(seq 1 60); do
            if docker logs immudb 2>&1 | grep -q "you can now use"; then exit 0; fi
            sleep 1
          done
          docker logs immudb
          exit 1
      # Redis serves plaintext on 6379 and TLS on 6380, with a certificate
      # made here; Valkey (6381) checks that the same client works with it.
      - name: Start Redis (plain and TLS) and Valkey
        run: |
          mkdir -p .ci/redis
          cd .ci/redis
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout server.key -out server.crt 2>/dev/null
          chmod 644 server.key
          docker run -d --name redis -p 6379:6379 -p 6380:6380 -v "$PWD:/certs:ro" \
            redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec \
            redis-server --port 6379 --tls-port 6380 \
            --tls-cert-file /certs/server.crt --tls-key-file /certs/server.key \
            --tls-ca-cert-file /certs/server.crt --tls-auth-clients no
          docker run -d --name valkey -p 6381:6379 \
            valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          for _ in $(seq 1 30); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG &&
              docker exec valkey valkey-cli ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs redis
          docker logs valkey
          exit 1
      # RabbitMQ serves AMQP on 5672, AMQP over TLS on 5671 (a certificate
      # made here), and its management API on 15672 (the ACL test uses it).
      - name: Start RabbitMQ (plain and TLS)
        run: |
          mkdir -p .ci/rabbitmq
          cd .ci/rabbitmq
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout server.key -out server.crt 2>/dev/null
          printf '%s\n' 'listeners.ssl.default = 5671' \
            'ssl_options.cacertfile = /certs/server.crt' \
            'ssl_options.certfile = /certs/server.crt' \
            'ssl_options.keyfile = /certs/server.key' \
            'ssl_options.verify = verify_none' > 20-tls.conf
          chmod 644 server.key 20-tls.conf
          docker run -d --name rabbitmq -p 5672:5672 -p 5671:5671 -p 15672:15672 \
            -e RABBITMQ_DEFAULT_USER=domainkit -e RABBITMQ_DEFAULT_PASS=domainkit \
            -v "$PWD:/certs:ro" -v "$PWD/20-tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro" \
            rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
          # Wait on the log, not "docker exec rabbitmq-diagnostics": an early
          # exec runs as root and writes the Erlang cookie the server (another
          # user) must create, so RabbitMQ fails to start.
          for _ in $(seq 1 90); do
            if docker logs rabbitmq 2>&1 | grep -q "Server startup complete"; then
              exit 0
            fi
            sleep 1
          done
          docker logs rabbitmq
          exit 1
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      - shell: bash
        run: |
          poetry run pytest -n auto --dist worksteal --cov -rs --junitxml=junit.xml | tee pytest.log
          ! grep -q "SKIPPED" pytest.log
      # Kept when the suite fails too: which tests failed, and the log (with
      # the stacks pytest-timeout prints for a hung test).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration
          path: |
            junit.xml
            pytest.log
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1

  # The benchmark ladder (docs/performance.md, ADR 0064): Python calls and
  # database round trips per request on each rung, against
  # benchmarks/budgets.toml; over budget fails. CPU time goes to the job
  # summary, beside the base branch's on pull requests, and is never gated:
  # a shared runner's timings are too noisy for that.
  bench:
    needs: changes
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DOMAINKIT_BENCH_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The base branch's code, measured by this harness for comparison.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      # Every extra, as make install: the modules each rung loads depend on
      # what is installed (prometheus_client, opentelemetry), and are gated.
      - run: poetry sync --all-extras
      - run: >-
          poetry run python -m benchmarks --strict --json ladder.json
          ${{ github.event_name == 'pull_request' && '--baseline base/src' || '' }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-ladder
          path: ladder.json
          retention-days: 30

  # Every line must run in some job: a few only run on SQLite, others only
  # against the servers. The combined report is the coverage gate.
  coverage:
    needs: [changes, test, integration]
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: poetry run coverage combine
      - run: poetry run coverage report --fail-under=100

  # The wheel must carry its templates and Alembic environment, and import
  # in a clean environment with only its declared dependencies.
  build:
    needs: [changes, lint, test]
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry build
      - run: |
          python -m zipfile -l dist/*.whl | grep -q "management/templates/domain"
          python -m zipfile -l dist/*.whl | grep -q "management/templates/project/dot-env-tpl"
          python -m zipfile -l dist/*.whl | grep -q "contrib/auth/common-passwords.txt.gz"
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[postgres]"
          /tmp/clean/bin/python -c "import domainkit, domainkit.broker, domainkit.cache, domainkit.contrib.messaging; print(domainkit.__version__)"
          /tmp/clean/bin/domainkit init smokeAPI /tmp/smoke
          test -f /tmp/smoke/.env && test -f /tmp/smoke/manage.py
      # The image a new project builds, with this wheel: it leaves out an env
      # file next to the Dockerfile, runs as a user without privileges,
      # passes check with the production settings, and answers /health
      # (INFRA-09, SEC-12c-2).
      - name: Build and run a new project's image
        run: |
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[postgres,redis,sqlite]"
          cd /tmp/smoke
          /tmp/clean/bin/python manage.py startdomain orders --minimal
          /tmp/clean/bin/python manage.py makemigrations -m "create"
          echo "SMOKE_API_SECRET_KEY=planted" > production.env
          docker build --build-context wheels="$GITHUB_WORKSPACE/dist" -t smoke .
          printf '%s\n' SMOKE_API_ALLOWED_HOSTS=api.example.com \
            SMOKE_API_DATABASE_URL=postgresql+asyncpg://app@db.internal/app \
            SMOKE_API_REDIS_URL=rediss://:s3cret@cache.internal:6380/0 \
            SMOKE_API_TRUSTED_PROXIES=10.0.0.0/8 \
            "SMOKE_API_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" > /tmp/smoke.env
          test -z "$(docker run --rm smoke find /app -name '*.env*')"
          test "$(docker run --rm smoke id -u)" = 10001
          if docker run --rm smoke touch /app/written; then exit 1; fi
          docker run --rm --env-file /tmp/smoke.env smoke python manage.py check
          docker run -d --name smoke -p 8000:8000 --env-file /tmp/smoke.env smoke
          for _ in $(seq 30); do
            curl -sf -H "Host: api.example.com" http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf -H "Host: api.example.com" http://127.0.0.1:8000/health
          docker stop smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          # A release of this commit downloads it from this run.
          retention-days: 90

  # Also in the weekly run: an advisory can appear with no change here.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      # PYSEC-2026-1325 (CVE-2024-23342): a timing attack on ecdsa signing.
      # immudb's SDK only verifies signatures with ecdsa, which the advisory
      # says is unaffected, and no fix is planned. See SECURITY.md.
      - run: poetry run pip-audit --progress-spinner off --ignore-vuln PYSEC-2026-1325
      - name: Scan the whole history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose

  # A CycloneDX bill of materials for the wheel CI built: the wheel, and
  # every package the lock resolves for it with all its extras (the dev
  # group left out), read from an environment holding just those. The
  # attest job attests it, bound to the wheel.
  sbom:
    needs: [changes, build]
    if: ${{ !cancelled() && !failure() && github.event_name != 'schedule' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=pypi depName=cyclonedx-bom
      CYCLONEDX_BOM_VERSION: "7.5.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: pipx install "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install the wheel on the locked packages it needs
        run: |
          poetry sync --only main --all-extras --no-root
          python -m pip --python .venv/bin/python install --no-deps dist/*.whl
          python -m pip --python .venv/bin/python check
      # cyclonedx-py reads the project from [tool.poetry] when that table
      # exists; the metadata is in [project], so it gets that alone. Not
      # --output-reproducible: it leaves out the serialNumber that
      # actions/attest requires of a CycloneDX document, and the release's
      # attestation of it fails.
      - name: Write the bill of materials
        run: |
          sed '/^\[tool\./,$d' pyproject.toml > sbom-pyproject.toml
          cyclonedx-py environment --pyproject sbom-pyproject.toml \
            --mc-type library --of JSON \
            -o sbom.cdx.json .venv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # On a push to main, the run a release of that commit reuses: signed
  # statements, kept by GitHub, that this run built the wheel and sdist
  # (SLSA build provenance, naming ci.yml at this commit and this run) and
  # what the wheel is made of (the bill of materials). release.yml checks
  # them before publishing. Its own job, which checks out nothing and runs
  # no code of the change, and only on pushes: the only one that may mint
  # an OIDC token or write attestations, never for a pull request.
  attest:
    needs: [build, sbom]
    # A status function: without one, a skipped job above (changes, on a
    # push) skips this one too, and 0.10.0 was released unattested.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # A Sigstore certificate naming this workflow run.
      attestations: write # Keeps the attestations with the repository.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest the bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: sbom/sbom.cdx.json

  # Static analysis of the package and the workflows with Semgrep's Python
  # and OWASP Top 10 rules, from its registry: no account, no token, no
  # metrics. A finding fails the job; one reviewed and kept carries a
  # "nosemgrep" comment and the reason. Also weekly: the rules change
  # without a change here. Semgrep's parser does not know generic functions
  # (PEP 695): it warns on the two modules that declare one, and scans them
  # in part. zizmor then audits the workflows themselves (template
  # injection, credentials left in checkouts, unpinned actions, excessive
  # permissions): any finding fails; one reviewed and kept carries a
  # "zizmor: ignore[...]" comment and the reason. Offline: it reads only
  # the files, needing no token.
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # renovate: datasource=pypi depName=semgrep
      SEMGREP_VERSION: "1.180.0"
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "semgrep==${SEMGREP_VERSION}"
      - run: >-
          semgrep scan --config p/python --config p/owasp-top-ten
          --metrics off --error --timeout 30 src .github
      - run: pipx install "zizmor==${ZIZMOR_VERSION}"
      - run: zizmor --offline --format github .github/workflows

  # The documentation site (mkdocs.yml): every page of docs/, and the API
  # reference generated from the docstrings of each name docs/api.md lists
  # (docs/hooks/site.py), built with --strict, so a link to a missing page
  # or heading, or a public name mkdocstrings cannot find, fails. It reads
  # the source and never imports it, so it needs only the docs group, and
  # it runs beside the tests, never after them. The site is kept as an
  # artifact for review.
  docs-site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --only docs --no-root
      - run: poetry run mkdocs build --strict --site-dir site
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/
          retention-days: 7

  # The newest releases the ranges in pyproject.toml allow, not the lock:
  # what "pip install domainkit[...]" resolves today. The other jobs test
  # the locked set; this one tests the top of every range, on pull requests
  # and weekly, as releases land upstream. It gates no release: a release
  # upstream must not hold back a fix here.
  newest:
    needs: changes
    if: >-
      ${{ !cancelled() && !failure() && github.event_name != 'push'
      && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # For the proof of settling cut-off connections, below.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry build --format wheel
      # Every extra and the dev group, each at the newest release its range
      # allows; the versions go to the job summary.
      - name: Install the wheel with the newest releases its ranges allow
        shell: bash
        run: |
          extras="$(python -c 'import tomllib; print(",".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]))')"
          python -m venv .newest
          .newest/bin/python -m pip install "$(ls dist/*.whl)[$extras]" --group dev
          .newest/bin/python -m pip check
          {
            echo "### Newest releases the ranges allow"
            echo '```'
            .newest/bin/python -m pip freeze --exclude domainkit
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Settling a connection a cancellation cut off reads state asyncpg and
      # SQLAlchemy keep privately, so it runs on the releases _PROVEN names
      # (ADR 0048). Its cases run here on the newest releases, against
      # PostgreSQL, with settling on where _PROVEN does not name them yet;
      # a skip fails. Then the suite's
      # test_the_installed_asyncpg_and_sqlalchemy_are_releases_proven says
      # whether to widen _PROVEN.
      - name: Prove settling on the installed asyncpg and SQLAlchemy
        shell: bash
        env:
          DOMAINKIT_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          .newest/bin/python -m pytest -n auto -rs \
            domainkit_tests/test_db_cut_off.py \
            domainkit_tests/test_sec11b_2_cut_off_session_lock.py | tee prove.log
          ! grep -q "SKIPPED" prove.log
      - run: .newest/bin/python -m pytest -n auto --junitxml=junit.xml
      # What "pip install domainkit[...]" resolves today, audited: the lock
      # the audit job reads is older. Like the job, it gates nothing.
      - run: >-
          .newest/bin/python -m pip_audit --progress-spinner off
          --ignore-vuln PYSEC-2026-1325
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-newest
          path: junit.xml
          retention-days: 14

  # The oldest releases the ranges allow: every dependency and extra at the
  # floor of its range (.github/scripts/floors.py, as pip constraints), and
  # what they need at the newest their own ranges allow. A floor is a
  # version CI tests (ADR 0075). Like newest, it gates nothing.
  oldest:
    needs: changes
    if: >-
      ${{ !cancelled() && !failure() && github.event_name != 'push'
      && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry build --format wheel
      - name: Install the wheel with the floors of its ranges
        shell: bash
        run: |
          python .github/scripts/floors.py > floors.txt
          extras="$(python -c 'import tomllib; print(",".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]))')"
          python -m venv .oldest
          .oldest/bin/python -m pip install "$(ls dist/*.whl)[$extras]" --group dev -c floors.txt
          .oldest/bin/python -m pip check
          {
            echo "### Oldest releases the ranges allow"
            echo '```'
            .oldest/bin/python -m pip freeze --exclude domainkit
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: .oldest/bin/python -m pytest -n auto --junitxml=junit.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-oldest
          path: junit.xml
          retention-days: 14

  # On a pull request that changes code: the mutants of the functions and
  # methods it changed (.github/scripts/changed_mutants.py, against the base
  # it merges into), so a change gets its mutation score before it merges,
  # not at the next weekly run. mutmut runs the suite once for its stats,
  # then each mutant with only the tests that reach its function. Not a
  # check the ruleset requires (ADR 0106): it fails when a run does not
  # finish, or when a changed function's mutant lives, and the summary
  # lists them, for the author to kill or to explain. A pull request of a
  # typical size finishes in this job. A larger one is stopped in time and
  # hands the mutants left to shards (mutation_shards.py), balanced by the
  # time of their tests, which reuse this job's stats instead of running
  # the whole suite again; mutation-changed-summary then judges them all.
  mutation-changed:
    name: mutation (changed)
    needs: changes
    if: >-
      ${{ !cancelled() && !failure() && github.event_name == 'pull_request'
      && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      # The merge commit and its first parent, the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      - name: Find the changed functions
        id: changed
        shell: bash
        run: |
          set -f
          mutants="$(poetry run python .github/scripts/changed_mutants.py HEAD^1)"
          echo "mutants=$mutants" >> "$GITHUB_OUTPUT"
          if [ -z "$mutants" ]; then
            echo "### Mutation of the changed functions: none changed" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The patterns are mutant names, not files: no globbing by the shell.
      # Interrupted (SIGINT) before the job's limit, mutmut stops and keeps
      # what it found and its stats, for the shards.
      - name: Run their mutants
        id: run
        if: steps.changed.outputs.mutants != ''
        shell: bash
        env:
          MUTANTS: ${{ steps.changed.outputs.mutants }}
        run: |
          set -f
          status=0
          timeout --signal=INT --kill-after=5m 40m poetry run mutmut run $MUTANTS || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::notice::The changed functions' mutants did not finish in 40 minutes; shards check the rest."
            status=0
          elif [ "$status" -ne 0 ] && [ -f mutants/mutmut-failures.txt ]; then
            echo "::group::Where mutmut's own run of the suite stopped (conftest.py)"
            cat mutants/mutmut-failures.txt
            echo "::endgroup::"
          fi
          exit "$status"
      - name: Hand the mutants left to shards
        id: plan
        if: steps.run.outcome == 'success'
        shell: bash
        env:
          MUTANTS: ${{ steps.changed.outputs.mutants }}
        run: |
          set -f
          poetry run python .github/scripts/mutation_shards.py plan $MUTANTS >> "$GITHUB_OUTPUT"
      - name: Summarise the changed functions' mutants
        if: ${{ !cancelled() && steps.changed.outputs.mutants != '' }}
        shell: bash
        env:
          MUTANTS: ${{ steps.changed.outputs.mutants }}
          SHARDS: ${{ steps.plan.outputs.shards }}
        run: |
          set -f
          if [ -n "$SHARDS" ]; then
            echo "### Mutation of the changed functions: the rest goes to shards $SHARDS" >> "$GITHUB_STEP_SUMMARY"
          else
            poetry run python .github/scripts/mutation_summary.py changed --lived-fails $MUTANTS >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ !cancelled() && steps.changed.outputs.mutants != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results-changed
          path: |
            changed-mutants.txt
            mutmut-results.txt
            mutation-summary.json
            mutants/**/*.meta
          if-no-files-found: ignore
          retention-days: 14
      - if: steps.plan.outputs.shards != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-changed-plan
          path: |
            mutation-shards.json
            mutants/mutmut-stats.json
          if-no-files-found: error
          retention-days: 1

  # The mutants mutation (changed) left, one shard each. The stats it saved
  # spare a shard mutmut's run of the whole suite: it lists the tests, runs
  # those of its mutants once clean, then the mutants.
  mutation-changed-shard:
    name: mutation (changed, ${{ matrix.shard }})
    needs: mutation-changed
    if: ${{ !cancelled() && needs.mutation-changed.outputs.shards != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-changed.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-changed-plan
      - name: Run the shard's mutants
        shell: bash
        run: |
          set -f
          mutants="$(poetry run python .github/scripts/mutation_shards.py names "$SHARD")"
          status=0
          timeout --signal=INT --kill-after=5m 45m poetry run mutmut run $mutants || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::Shard $SHARD of the changed functions' mutants did not finish in 45 minutes."
          elif [ "$status" -ne 0 ] && [ -f mutants/mutmut-failures.txt ]; then
            echo "::group::Where mutmut's own run of the suite stopped (conftest.py)"
            cat mutants/mutmut-failures.txt
            echo "::endgroup::"
          fi
          exit "$status"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-changed-shard-${{ matrix.shard }}
          path: mutants/**/*.meta
          if-no-files-found: ignore
          retention-days: 14

  # Every shard's results, with those of mutation (changed): it fails when a
  # mutant was never checked, or a changed function's mutant lived, and the
  # summary lists them.
  mutation-changed-summary:
    name: mutation (changed, summary)
    needs: [mutation-changed, mutation-changed-shard]
    if: ${{ !cancelled() && needs.mutation-changed.outputs.shards != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --only dev --no-root
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutmut-results-changed
      # Each shard's files in a directory of its own, below mutants/.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-changed-shard-*
          path: mutants/shards
      - name: Summarise the changed functions' mutants
        shell: bash
        run: |
          set -f
          poetry run python .github/scripts/mutation_summary.py changed --lived-fails $(cat changed-mutants.txt) >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results-changed-summary
          path: |
            mutmut-results.txt
            mutation-summary.json
          if-no-files-found: ignore
          retention-days: 14

  # The whole package's mutants take longer than one job may run, so they run
  # in shards, balanced by the time their mutants' tests take: about 200
  # minutes each on four workers if every mutant ran all its tests (from
  # mutmut's own test durations, October 2026), where 8 shards by line
  # count needed up to 830. Each shard also runs the suite twice first
  # (mutmut's stats and clean run). Every module must fall in exactly one
  # shard; domainkit_tests/test_ci.py checks that. GitHub stops a job at six
  # hours, so mutmut is stopped at 320 minutes and the shard still reports.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: mutation (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: auth-1
            mutants: >-
              domainkit.contrib.auth.admin.* domainkit.contrib.auth.apps.*
              domainkit.contrib.auth.authentication.* domainkit.contrib.auth.cookies.*
              domainkit.contrib.auth.metrics.* domainkit.contrib.auth.permissions.*
              domainkit.contrib.auth.signup.* domainkit.contrib.auth.tokens.*
          - name: auth-2
            mutants: >-
              domainkit.contrib.auth.devices.*
              domainkit.contrib.auth.events.* domainkit.contrib.auth.onetime.*
              domainkit.contrib.auth.personal_tokens.*
              domainkit.contrib.auth.principals.* domainkit.contrib.auth.tasks.*
              domainkit.contrib.auth.totp.* domainkit.contrib.auth.uow.*
          - name: auth-3
            mutants: >-
              domainkit.contrib.auth.api.* domainkit.contrib.auth.backends.*
              domainkit.contrib.auth.hashers.* domainkit.contrib.auth.management.*
              domainkit.contrib.auth.middleware.* domainkit.contrib.auth.repositories.*
              domainkit.contrib.auth.settings.* domainkit.contrib.auth.users.*
          - name: auth-4
            mutants: >-
              domainkit.contrib.auth.access.* domainkit.contrib.auth.certificates.*
              domainkit.contrib.auth.erasure.* domainkit.contrib.auth.exceptions.*
              domainkit.contrib.auth.mfa.* domainkit.contrib.auth.models.*
              domainkit.contrib.auth.recovery.* domainkit.contrib.auth.tables.*
              domainkit.contrib.auth.testing.*
              domainkit.contrib.auth.throttling.* domainkit.contrib.auth.validators.*
          - name: http-1
            mutants: >-
              domainkit.http.application.* domainkit.http.blocking.*
              domainkit.http.errors.* domainkit.http.filters.* domainkit.http.guard.*
              domainkit.http.live_events.* domainkit.http.locale.*
              domainkit.http.metrics.* domainkit.http.openapi.*
              domainkit.http.ratelimit.* domainkit.http.routing.*
              domainkit.http.shedding.* domainkit.http.sse.* domainkit.http.versioning.*
              domainkit.http.access.*
          - name: http-2
            mutants: >-
              domainkit.http.client.* domainkit.http.deadlines.* domainkit.http.health.*
              domainkit.http.live.* domainkit.http.middleware.*
              domainkit.http.pagination.* domainkit.http.responses.*
              domainkit.http.servers.* domainkit.http.uploads.*
              domainkit.http.websockets.* domainkit.http.apidocs.*
          - name: data-1
            mutants: >-
              domainkit.db.dbclock.* domainkit.db.derive.* domainkit.db.drivers.*
              domainkit.db.fixtures.* domainkit.db.migrations.* domainkit.db.orm.*
              domainkit.db.query.* domainkit.db.repository.* domainkit.db.uow.*
              domainkit.ledger.* domainkit.db.money.*
              domainkit.db.models.*
          - name: data-2
            mutants: >-
              domainkit.cache.* domainkit.db.connections.* domainkit.db.errors.*
              domainkit.db.partitioning.* domainkit.db.routing.*
              domainkit.db.snapshots.* domainkit.db.squashing.* domainkit.db.types.*
              domainkit.storage.* domainkit.money.*
          - name: messaging
            mutants: >-
              domainkit.contrib.messaging.* domainkit.broker.*
              domainkit.contrib.webhooks.* domainkit.contrib.notifications.*
              domainkit.contrib.mail.*
          - name: management-1
            mutants: >-
              domainkit.apps.registry.* domainkit.management.commands.addevent.*
              domainkit.apps.hooks.*
              domainkit.management.commands.broker.*
              domainkit.management.commands.dumpdata.*
              domainkit.management.commands.makemigrations.*
              domainkit.management.commands.openapi.*
              domainkit.management.commands.shell.* domainkit.management.generators.*
              domainkit.management.x* domainkit.utils.redis_urls.*
              domainkit.utils.text.*
          - name: management-2
            mutants: >-
              domainkit.conf.global_settings.* domainkit.debug.*
              domainkit.management.commands.dbshell.*
              domainkit.management.commands.seed.*
              domainkit.management.commands.squashmigrations.*
              domainkit.management.commands.startaggregate.*
              domainkit.management.commands.startdomain.* domainkit.utils.loops.*
              domainkit.utils.rates.* domainkit.utils.readiness.*
          - name: management-3
            mutants: >-
              domainkit.conf.env.* domainkit.conf.lazy.* domainkit.checks.*
              domainkit.management.commands.check.*
              domainkit.management.commands.diffsettings.*
              domainkit.management.commands.flush.* domainkit.management.commands.init.*
              domainkit.management.commands.runserver.* domainkit.management.operators.*
              domainkit.utils.closing.* domainkit.utils.formatting.*
              domainkit.utils.module_loading.* domainkit.utils.delivery.*
          - name: management-4
            mutants: >-
              domainkit.apps.config.* domainkit.management.base.*
              domainkit.management.commands.addcommand.*
              domainkit.management.commands.addquery.*
              domainkit.management.commands.cache.*
              domainkit.management.commands.compilemessages.*
              domainkit.management.commands.loaddata.*
              domainkit.management.commands.migrate.*
              domainkit.management.commands.partitions.*
              domainkit.management.commands.showmigrations.* domainkit.utils.decimals.*
              domainkit.utils.headers.*
          - name: domain
            mutants: >-
              domainkit.resources.* domainkit.ddd.* domainkit.testing.* domainkit.i18n.*
          - name: contrib-1
            mutants: >-
              domainkit.contrib.audit.recorder.* domainkit.contrib.idempotency.apps.*
              domainkit.contrib.idempotency.middleware.*
          - name: contrib-2
            mutants: >-
              domainkit.contrib.admin.* domainkit.contrib.audit.api.*
              domainkit.contrib.audit.apps.* domainkit.contrib.audit.baseline.*
              domainkit.contrib.audit.history.* domainkit.contrib.audit.management.*
              domainkit.contrib.audit.models.* domainkit.contrib.audit.personal.*
              domainkit.contrib.audit.protection.* domainkit.contrib.audit.seals.*
              domainkit.contrib.audit.settings.* domainkit.contrib.audit.tasks.*
              domainkit.contrib.audit.checkpoints.* domainkit.contrib.audit.pruning.*
              domainkit.contrib.audit.ledgerstates.*
              domainkit.contrib.contenttypes.* domainkit.contrib.evidence.*
              domainkit.contrib.flags.* domainkit.contrib.idempotency.operations.*
              domainkit.contrib.idempotency.settings.*
              domainkit.contrib.idempotency.statements.*
              domainkit.contrib.idempotency.tasks.*
              domainkit.contrib.objectpermissions.* domainkit.contrib.privacy.*
          - name: accounting
            mutants: >-
              domainkit.contrib.accounting.*
          - name: approvals
            mutants: >-
              domainkit.contrib.approvals.*
          - name: core
            mutants: >-
              domainkit.x* domainkit.architecture.* domainkit.clock.*
              domainkit.context.* domainkit.deadlines.* domainkit.deprecation.*
              domainkit.encryption.* domainkit.exceptions.* domainkit.lifecycle.*
              domainkit.log.* domainkit.reporting.* domainkit.signing.*
              domainkit.tasks.* domainkit.tracing.*
    env:
      MUTANTS: ${{ matrix.shard.mutants }}
      SHARD: ${{ matrix.shard.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      # The patterns are mutant names, not files: no globbing by the shell.
      # Interrupted (SIGINT) before the job's limit, mutmut stops and keeps
      # what it found, so the steps below still report it, as incomplete.
      - name: Run the shard's mutants
        shell: bash
        run: |
          set -f
          status=0
          timeout --signal=INT --kill-after=5m 320m poetry run mutmut run $MUTANTS || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::Shard $SHARD did not finish in 320 minutes; split it."
          elif [ "$status" -ne 0 ] && [ -f mutants/mutmut-failures.txt ]; then
            echo "::group::Where mutmut's own run of the suite stopped (conftest.py)"
            cat mutants/mutmut-failures.txt
            echo "::endgroup::"
          fi
          exit "$status"
      # The score and the mutants that lived go to the job summary and to
      # the artifact; a mutant never checked fails the job.
      - name: Summarise the shard
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -f
          poetry run python .github/scripts/mutation_summary.py "$SHARD" $MUTANTS >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results-${{ matrix.shard.name }}
          path: |
            mutmut-results.txt
            mutation-summary.json
          if-no-files-found: ignore
          retention-days: 90
