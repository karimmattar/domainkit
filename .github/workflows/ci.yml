# Every push and pull request: lint, tests, build, audits. Weekly (and on
# demand): a full mutation testing run. Actions are pinned to commit SHAs;
# Renovate updates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry check --lock
      - run: poetry sync --all-extras --with dev
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy

  test:
    # The main branch ruleset requires these check names; rename them there
    # in the same change.
    name: test (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      - run: >-
          poetry run pytest --cov --cov-report=term --cov-report=xml
          --junitxml=junit.xml
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  # The suite again with its database tests on PostgreSQL, where row locks
  # (SKIP LOCKED), the audit triggers, server-side timeouts, and migrations
  # differ from SQLite. Coverage stays the test jobs' gate: a few lines run
  # only on SQLite.
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DOMAINKIT_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      # A skipped test means the server went unused; fail instead.
      - shell: bash
        run: |
          poetry run pytest -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log

  # The wheel must carry its templates and Alembic environment, and import
  # in a clean environment with only its declared dependencies.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry build
      - run: |
          python -m zipfile -l dist/*.whl | grep -q "management/templates/domain"
          python -m zipfile -l dist/*.whl | grep -q "management/templates/project/dot-env-tpl"
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[postgres]"
          /tmp/clean/bin/python -c "import domainkit, domainkit.contrib.messaging; print(domainkit.__version__)"
          /tmp/clean/bin/domainkit init smokeAPI /tmp/smoke
          test -f /tmp/smoke/.env && test -f /tmp/smoke/manage.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      # domainkit itself is reported as skipped until it is on PyPI.
      - run: poetry run pip-audit --progress-spinner off
      - name: Scan the whole history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pipx install "poetry==${POETRY_VERSION}"
      - run: poetry sync --all-extras --with dev
      - run: poetry run mutmut run
      - run: poetry run mutmut results | tee mutmut-results.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results
          path: mutmut-results.txt
          retention-days: 90
