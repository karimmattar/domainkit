site_name: domainkit
site_description: Django's conventions for domain-driven FastAPI services.
repo_url: https://github.com/karimmattar/domainkit
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  logo: assets/domainkit-icon.png
  favicon: assets/domainkit-icon.png
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light}

exclude_docs: |
  hooks/
  adr/template.md

# Each record is reached from the index of decisions.
not_in_nav: |
  adr/0*.md
  reference/api/domainkit*.md

hooks:
  - docs/hooks/site.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            show_symbol_type_heading: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started:
      - tutorial.md
      - tutorial/1-first-resource.md
      - tutorial/2-rules.md
      - tutorial/3-permissions.md
      - tutorial/4-events.md
      - tutorial/5-testing-and-deploying.md
  - How-to:
      - recipes.md
      - from-django.md
      - recipes/payments.md
      - recipes/exactly-once.md
      - recipes/jwt-keys.md
      - recipes/behind-a-proxy.md
      - recipes/read-replica.md
  - Guides:
      - resources.md
      - queries.md
      - databases.md
      - money.md
      - Users and permissions:
          - auth.md
          - auth/install.md
          - auth/users.md
          - auth/authentication.md
          - auth/logging-in.md
          - auth/routes.md
          - auth/step-up.md
          - auth/pci-dss.md
      - Optional apps:
          - contrib.md
          - contrib/messaging.md
          - contrib/webhooks.md
          - contrib/audit.md
          - contrib/idempotency.md
          - contrib/evidence.md
          - contrib/flags.md
          - contrib/accounting.md
          - contrib/approvals.md
          - contrib/limits.md
      - cache.md
      - live.md
      - uploads.md
      - mail.md
      - i18n.md
      - privacy.md
      - testing.md
      - runtime.md
      - performance.md
  - Operations:
      - deploying.md
      - operations.md
      - runbook.md
      - security.md
      - threat-model.md
      - upgrading.md
  - Reference:
      - reference.md
      - Settings, checks, and commands:
          - reference/settings.md
          - reference/backends.md
          - reference/http.md
          - reference/servers.md
          - reference/checks.md
          - reference/responses.md
          - reference/signing.md
          - reference/observability.md
          - reference/test-plugin.md
          - reference/commands.md
          - reference/extension-points.md
      - Public API:
          - api.md
          - api/core.md
          - api/data.md
          - api/http.md
          - api/auth.md
          - api/contrib.md
      - API reference: reference/api/index.md
